# Integration test matrix for spm-to-xcframework.
#
# Each entry produces one invocation of the tool. The runner subprocess-calls
# `spm-to-xcframework <url> -v <version> -o <tmp> --min-<plat> <ver>... [args...]`,
# then asserts every `expected_products` entry exists in the output and every
# slice's binary is dynamic Mach-O with the expected ABI surface.
#
# The matrix prioritises code-path diversity over package popularity. Every
# entry's `exercises` field documents which tool function(s) it covers — that
# field is the contract that justifies the entry being on the list. If two
# packages exercise the same paths, only the smaller/faster one belongs here.
#
# `min_versions` is both the build constraint (becomes --min-<platform> flags)
# AND the slice-set assertion ("these platform variants must appear in the
# output xcframework"). The initial matrix is iOS-only for portability —
# multi-platform stress can be layered on once every developer running this
# has watchOS/visionOS simulator runtimes installed.
#
# `smoke = true` flags the cheap pre-commit / per-PR subset (the fast canaries
# for common Plan/Prepare/Execute regressions). The rest of the matrix runs
# nightly / pre-release. See `README.md` for the rationale per entry.
#
# `known_broken = true` entries pair with `broken_signature` — a substring the
# runner asserts must appear in the build log for the failure to count as
# "known". If a known-broken package starts failing in a *new* way, the
# signature stops matching and the entry fails the run, forcing fresh triage.
# The `exercises` list on a `known_broken` entry is aspirational — those code
# paths will be covered once the documented bug is fixed; today they aren't.

# 1 — Pure-Swift sanity baseline. Pre-existing .library(type: .dynamic) +
# .copy resource bundle (PrivacyInfo) + linkerSettings. Doubles as the
# small/fast canary: if this fails, the toolchain is the suspect.
[[package]]
name = "snapkit"
url = "https://github.com/SnapKit/SnapKit"
version = "5.7.1"
min_versions = { ios = "13.0" }
expected_products = ["SnapKit"]
exercises = [
    "pure-swift-single-product",
    "preexisting-dynamic-product",
    "linker_settings",
    "inject_resource_bundles",
    "inject_swiftmodule",
]
smoke = true
notes = "Pre-existing .library(type: .dynamic) — planner should NOT add a synthetic dynamic sibling. PrivacyInfo bundle exercises the resource path."

# 2 — ObjC-only product. Forces the synthetic dynamic-library plan (the
# post-spike replacement for source-mode promote_static_to_framework).
[[package]]
name = "mbprogresshud"
url = "https://github.com/jdg/MBProgressHUD"
version = "1.2.0"
min_versions = { ios = "11.0" }
expected_products = ["MBProgressHUD"]
exercises = [
    "objc-only",
    "synth_dynamic_library",
    "inject_objc_headers",
    "modulemap-generation",
    "tools-version-bump",
]

# 4 — systemLibrary + resource bundles. The highest-ROI single-package
# coverage for Phase-4 injection passes against C-shimmed Swift.
[[package]]
name = "grdb"
url = "https://github.com/groue/GRDB.swift"
version = "v6.29.3"
min_versions = { ios = "13.0" }
expected_products = ["GRDB"]
exercises = [
    "system_library_target",
    "inject_system_clang_modules",
    "inject_resource_bundles",
    "cSettings",
]
smoke = true
notes = "systemLibrary target CSQLite → inject_system_clang_modules. .copy resources + PrivacyInfo."

# 5 — Multi-product Swift with sibling target deps. Exercises Plan's
# multi-unit topology without the heavy dedup-overlap path Stripe covers.
[[package]]
name = "nuke"
url = "https://github.com/kean/Nuke"
version = "12.8.0"
min_versions = { ios = "13.0" }
expected_products = ["Nuke", "NukeUI", "NukeVideo", "NukeExtensions"]
exercises = [
    "pure-swift-multi-product",
    "internal-target-deps",
    "version-specific-manifest-add-product",  # Package@swift-5.9.swift active
    "package-name-strip",  # Nuke + NukeUI share `package staged`
]

# 6 — Apple library-evolution stress. Filtered to the umbrella product to
# keep build time bounded — the .swiftinterface emission path is the same.
# Also the canonical CustomTarget-wrapper case: the manifest assigns
# `Target.target = CustomTarget.target` so every `.target(...)` call is
# really a wrapper. Drives the overlay-injection path in Prepare and the
# phantom-helper dep augmentation in Execute (the umbrella's compile needs
# FRAMEWORK_SEARCH_PATHS to reach the auto-synth'd sibling xcframeworks).
[[package]]
name = "swift-collections"
url = "https://github.com/apple/swift-collections"
version = "1.1.4"
min_versions = { ios = "13.0" }
args = ["--product", "Collections"]
expected_products = [
    "Collections",
    "BitCollections",
    "DequeModule",
    "HashTreeCollections",
    "HeapModule",
    "OrderedCollections",
    "InternalCollectionsUtilities",
]
exercises = [
    "library-evolution",
    "inject_swiftmodule-swiftinterface",
    "string-interpolation-walker",
    "non-literal-products-surgery-fallback",  # `products: _products` (variable)
    "custom-target-wrapper-overlay",  # CustomTarget.target shadow → overlay injection
    "auto-synth-sibling-xcframeworks",  # internal-only Swift siblings promoted to standalone
    "phantom-helper-dep-injection",  # umbrella's deps array gets transitive helpers appended
]

