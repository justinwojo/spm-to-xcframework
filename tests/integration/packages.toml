    "executable-target-filtering",
    "version-specific-manifest-add-product",  # Package@swift-5.9.swift active
    "transitive-sibling-xcframeworks",  # `.package(url:...)` deps → sibling xcframeworks
    "prune-child-manifest-for-products",  # carton-class dev deps stripped before child resolve
]
notes = "Each transitive `.package(url:...)` dep listed in `expected_products` ships as its own xcframework so the umbrella's `.swiftinterface @_exported import`s resolve. The child runs prune their Package.swift to drop `#if`-gated dev-only dependencies (carton, swift-docc-plugin, …) before `swift package resolve` ever sees them."

# 10 — Bridge clang modules. The canonical WCDB_Private case — the
# hardest injection path in the tool. Heavy C/C++ sources + project-shipped
# module.modulemap that must be materialised inside the framework.
[[package]]
name = "wcdb"
url = "https://github.com/Tencent/wcdb"
version = "v2.1.10"
min_versions = { ios = "13.0" }
args = ["--product", "WCDBSwift"]
expected_products = ["WCDBSwift"]
exercises = [
    "bridge_clang_modules",
    "inject_bridge_clang_modules",
    "mixed-c-cxx-objc-sources",
    "external-sqlcipher-dep",
]
notes = "The hard one. Bridge clang module shim walking — keep in the matrix even if expensive."

# 11 — Dedup-overlap rewrite path. Stripe's umbrella product depends on
# StripeCore and StripeUICore (.target, not .library), forcing the planner
# to rewrite the umbrella's Package.swift to consume the siblings as
# .binaryTarget before its own archive runs.
[[package]]
name = "stripe-ios"
url = "https://github.com/stripe/stripe-ios"
version = "24.0.0"
min_versions = { ios = "15.0" }
args = [
    "--product", "Stripe",
    "--target", "StripeCore", "--target", "StripeUICore",
    "--target", "StripeApplePay", "--target", "StripePayments", "--target", "StripePaymentsUI",
]
expected_products = ["Stripe", "StripeCore", "StripeUICore", "StripeApplePay", "StripePayments", "StripePaymentsUI"]
# StripePayments.swiftinterface imports Stripe3DS2 (a separately-distributed
# Stripe internal target). The matrix intentionally doesn't build it — adding
# it would balloon build time without exercising any new code path. Real
# Stripe consumers ship Stripe3DS2 alongside via SwiftPM. Documented opt-out
# so the verify's clang-import check passes on this entry.
allowed_unresolved = ["Stripe3DS2"]
exercises = [
    "dedup-overlap",
    "_compute_dedup_substitutions",
    "edit_replace_with_binary_target",
    "internal-target-deps",
]
notes = "Multi-product + internal .target sibling deps. Triggers the dedup-overlap rewrite — Stripe.xcframework would otherwise statically embed StripeCore. All five sibling .targets the Stripe umbrella `.swiftinterface` imports are listed so the produced bundle is consumer-complete (a partial build leaves unresolved `import StripeApplePay`/`StripePayments`/`StripePaymentsUI`)."

# 12 — Library-evolution resilience boundary stress test. swift-syntax has ~31
# internal targets; SwiftParser depends on SwiftSyntax + six version-compat
# layers (SwiftSyntax509…603). The compat layers have no `.library()` products
# (internal-only) so auto-synth promotes them. SwiftSyntax HAS a library
# product, so it stays as a regular .target dep.
#
# SwiftParser does exhaustive switches over enums from SwiftSyntax (e.g.,
# `Keyword`, `RawSameTypeRequirementSyntax.LeftType`). With dedup-overlap ON,
# SwiftSyntax gets rewritten to `.binaryTarget` for SwiftParser's build →
# SwiftParser sees SwiftSyntax as an externally-resilient module → exhaustive
# switches without `@unknown default` become hard errors at .swiftinterface
# emit time. The execute-phase try-and-fallback (run_unit.py
# `_is_resilience_diagnostic`) catches this exact diagnostic, restores the
# pre-substitution manifest, and re-archives SwiftParser as a same-package
# `.target` so the resilience boundary is dropped — at the cost of
# statically embedding the sibling code into SwiftParser.framework. This
# matrix entry exercises the fallback path end-to-end with no extra flags.
[[package]]
name = "swift-syntax"
url = "https://github.com/swiftlang/swift-syntax"
version = "603.0.1"
min_versions = { ios = "13.0" }
args = ["--product", "SwiftParser"]
expected_products = [
    "SwiftParser",
    "SwiftSyntax",
    "SwiftSyntax509",
    "SwiftSyntax510",
    "SwiftSyntax600",
    "SwiftSyntax601",
    "SwiftSyntax602",
    "SwiftSyntax603",
]
exercises = [
    "large-internal-target-graph",  # ~31 targets in package
    "auto-synth-sibling-xcframeworks",  # 6 compat layers (no product) promoted
    "auto-synth-respects-existing-product",  # SwiftSyntax has product, not auto-promoted
    "dedup-overlap-resilience-fallback",  # try-and-fallback on Swift switch-exhaustiveness diagnostic
    "non-literal-products-surgery-fallback",  # let products: [Product] with conditional
    "mixed-c-swift-internal-target",  # _SwiftSyntaxCShims (C) embedded into SwiftSyntax framework
    "cross-product-framework-search-path-linkage",  # SwiftParser dyn-links SwiftSyntax via SPM
]
notes = "Canonical try-and-fallback exerciser (2026-05-21). SwiftParser umbrella archive fails on Swift's `may have additional unknown values` diagnostic with dedup-overlap ON; run_unit.py's fallback restores the manifest and re-archives without substitution, producing SwiftParser.xcframework with siblings statically embedded. SwiftSyntax.xcframework reports as [Mixed] because of the _SwiftSyntaxCShims C target embedded into it; SwiftParser and the six SwiftSyntax5XX-603 compat layers are pure [Swift]."

# 13 — Swift macros / compiler plugins. Canonical case where the umbrella
# library declares `public macro X() = #externalMacro(...)` whose backing
# target is a `.macro(...)` with `.product(name:, package:)` deps on
# swift-syntax. xcodebuild's SPM integration drops the macro's external-
# package deps when generating its workspace, so the macro target's
# swiftc call fails with "Unable to find module dependency: 'SwiftSyntax'".
# Tool fix: pre-build the macro plugin via `swift build -c release
# --product <name>` (host-arch executable, swift-syntax resolved
# natively), strip the macro name from regular targets' dependency
# arrays in the active Package.swift, and inject
# `-Xfrontend -load-plugin-executable -Xfrontend <abs-path>#<module>`
# into per-unit OTHER_SWIFT_FLAGS so swiftc can expand `#externalMacro`
# references against the pre-built plugin at archive time.
[[package]]
name = "swift-case-paths"
url = "https://github.com/pointfreeco/swift-case-paths"
version = "1.7.3"
min_versions = { ios = "13.0" }
args = ["--product", "CasePaths"]
expected_products = ["CasePaths", "CasePathsCore"]
exercises = [
    "macro-plugin-prebuild",  # swift build -c release --product CasePathsMacros
    "macro-dep-strip",  # `"CasePathsMacros"` stripped from CasePaths.dependencies
    "load-plugin-executable-flag-injection",  # -Xfrontend -load-plugin-executable
    "conditional-test-target-preserved",  # `if OMIT_MACRO_TESTS == nil` block intact
    "auto-synth-sibling-xcframeworks",  # CasePathsCore auto-promoted alongside umbrella
]
notes = "swift-case-paths declares but does not USE @CasePathable inside the runtime library — Sources/CasePaths/Macros.swift only contains the public macro declaration. Macro EXPANSION happens at consumer build time; this entry exercises the build-time plugin loading required to compile the macro declaration itself."

# 14 — Pure-Swift baseline with multi-product (library + command plugins).
# swift-argument-parser declares three products: one .library(ArgumentParser)
# and two .plugin(...) command plugins (GenerateDoccReference, GenerateManual).
# Plan must filter out plugin products (they're build-tool commands, not
# library/binary artifacts shipped to consumers). Also exercises executable
# target filtering (Tools/{generate-docc-reference,generate-manual} +
# Examples/{roll,math,repeat,color}) which Plan should skip.
[[package]]
name = "swift-argument-parser"
url = "https://github.com/apple/swift-argument-parser"
version = "1.7.1"
min_versions = { ios = "13.0" }
args = ["--product", "ArgumentParser"]
expected_products = ["ArgumentParser", "ArgumentParserToolInfo"]
exercises = [
    "pure-swift-multi-product-with-plugins",
    "plugin-product-filtering",  # .plugin(...) products dropped from build
    "executable-target-filtering",  # Tools/* + Examples/* executableTargets skipped
    "auto-synth-sibling-xcframeworks",  # ArgumentParserToolInfo (internal-only) promoted
]
notes = "Smallest/fastest pure-Swift smoke entry beyond snapkit. Hits the plugin-product filter path — first matrix entry with .plugin(...) products in the umbrella manifest."

# 15 — Traits + experimental swift settings + transitive dep via
# --include-deps. swift-async-algorithms uses the SPM `traits:` API
# (added in swift-tools-version 6.0), `AvailabilityMacro` experimental
# feature, and `StrictConcurrency=complete`. AsyncAlgorithms depends on
# .product(OrderedCollections, DequeModule, package: "swift-collections"),
# so --include-deps pulls swift-collections in as a sibling package and
# the transitive deps surface as separate xcframeworks. AsyncStreaming
# (also a product) requires the BasicContainers / ContainersPreview
# products of swift-collections which only exist on its main branch — we
# build AsyncAlgorithms only.
#
# KNOWN_BROKEN: swift-collections 1.5.x's InternalCollectionsUtilities
# uses `@_lifetime` and `~Escapable` annotations gated by
# `#if compiler(>=6.2)`. The package declares
# `.enableExperimentalFeature("Lifetimes")` in swiftSettings, and the
# resulting swiftc command line under xcodebuild archive does include
# `-enable-experimental-feature Lifetimes` (verified in build log).
# Standalone `xcrun swiftc -typecheck` with that exact flag accepts
# `@_lifetime`, but xcodebuild's library-evolution archive (EmitSwiftModule
# phase) on Xcode 26.3 rejects it anyway. Reproduces with a vanilla
# `xcodebuild archive -scheme AsyncAlgorithms BUILD_LIBRARY_FOR_DISTRIBUTION=YES`
# against a fresh git clone with zero spm-to-xcframework involvement, so
# this is an Xcode SPM-integration limitation, not a tool bug. Revisit
# when a newer Xcode lands (or when swift-collections 1.6 lifts the
# experimental gating).
[[package]]
name = "swift-async-algorithms"
url = "https://github.com/apple/swift-async-algorithms"
version = "1.1.4"
min_versions = { ios = "13.0" }
args = ["--include-deps", "--product", "AsyncAlgorithms"]
expected_products = [
    "AsyncAlgorithms",
    "DequeModule",
    "OrderedCollections",
    "InternalCollectionsUtilities",
]
exercises = [
    "include-deps-transitive",
    "traits-api",  # swift-tools-version 6.2 traits: [...] block
    "experimental-swift-settings",  # AvailabilityMacro + StrictConcurrency=complete
    "transitive-sibling-xcframeworks",  # swift-collections built alongside AsyncAlgorithms
    "selective-product-filter",  # AsyncStreaming product excluded via --product
]
known_broken = true
broken_signature = "'@_lifetime' attribute is only valid when experimental feature Lifetimes is enabled"
broken_reason = "Xcode 26.3 + swift-collections 1.5.x interaction. The InternalCollectionsUtilities target's `@_lifetime`-annotated `~Escapable` helpers (LifetimeOverride.swift, #if compiler(>=6.2)) are rejected by xcodebuild's library-evolution EmitSwiftModule phase even though swiftSettings enable the Lifetimes experimental feature and the flag is passed on the swiftc command line. Reproduces with a vanilla `xcodebuild archive` against a fresh swift-async-algorithms checkout — no tool involvement — so this is an Xcode SPM-integration limitation, not a spm-to-xcframework bug. Re-test on Xcode 26.4 / swift-collections 1.6."
notes = "First matrix entry exercising the SPM traits API and AvailabilityMacro experimental feature. Currently known_broken — see broken_reason. AsyncStreaming is intentionally NOT built — it depends on BasicContainers/ContainersPreview which are post-1.x swift-collections targets."

# 15b — TCA-class transitive graph regression test for commit 1d20825
# ("Harden the transitive-siblings path against TCA-class graphs"). The
# Composable Architecture pulls in 11 external packages and 13 transitive
# dependency products through its dependency closure, with cross-sibling
# re-export chains, foreign-child product candidates, testTarget-only
# children, and overlay-name post-init mutation — exactly the shapes
# 1d20825 hardened. The local probe confirmed 13 dependency xcframeworks
# build successfully (CombineSchedulers, ConcurrencyExtras, CustomDump,
# Dependencies, IdentifiedCollections, IssueReporting, OrderedCollections,
# Perception, PerceptionCore, Sharing, SwiftNavigation, UIKitNavigation,
# XCTestDynamicOverlay) before swift-collections' InternalCollectionsUtilities
# hits the same Xcode 26.3 / `@_lifetime` ceiling as swift-async-algorithms
# (which also takes out ComposableArchitecture itself, since the umbrella
# transitively depends on it). So this entry is currently `known_broken`
# with the identical signature, but the 13 successful dependency builds
# en route to the failure are what exercise the hardened code paths —
# that's the actual regression value. When Xcode 26.4 or
# swift-collections 1.6 lifts the experimental gate, this entry
# transitions to PASS without code changes.
[[package]]
name = "swift-composable-architecture"
url = "https://github.com/pointfreeco/swift-composable-architecture"
version = "1.25.5"
min_versions = { ios = "13.0" }
args = ["--include-deps", "--product", "ComposableArchitecture"]
expected_products = ["ComposableArchitecture"]
exercises = [
    "include-deps-transitive",
    "tca-class-dependency-graph",  # 11 transitive packages, 13 sibling products
    "cross-sibling-reexport-expansion",  # 1d20825: re-exported siblings across packages
    "foreign-child-product-leak-filter",  # 1d20825: skip products owned by other packages
    "overlay-names-post-init-mutation-guard",  # 1d20825: _SPM2XC_OVERLAY_NAMES mutability
    "testtarget-pruning-large-graph",  # testTargets dropped from transitive closure
    "swift-macros-pre-built",  # ComposableArchitectureMacros via swift build -c release
]
known_broken = true
broken_signature = "'@_lifetime' attribute is only valid when experimental feature Lifetimes is enabled"
# `required_log_signatures` is the actual regression guard. The
# `broken_signature` alone would mask a regression that fails *before*
# any siblings build (e.g. a Plan-phase break that happens to emit the
# `@_lifetime` substring downstream). Pinning the sibling-ready lines
# forces the run to have walked the hardened transitive paths from
# 1d20825 before the Xcode bug trips. If any of these stop appearing,
# the classifier flips to "fail" and the entry needs fresh triage.
# `create_xcframework.py:346` emits `<name>.xcframework ready (dependency)`
# for each successful sibling build.
# Signatures match what the transitive-products orchestrator emits
# today: `<name>.xcframework ready [Swift]` for each successful child
# run. The orchestrator path does NOT carry the `(dependency)` infix —
# that suffix is reserved for in-process sibling builds under
# `--include-deps`, a code path the orchestrator supersedes for
# cross-package transitives. swift-collections is the first transitive
# package archived; OrderedCollections trips the `@_lifetime` bug
# there and aborts the run, so only the seven packages whose topological
# order places them before swift-collections actually reach a `ready`
# line in the haystack. If any of these seven stop appearing, the entry
# flips to fail and needs fresh triage. Codex review's original concern
# stands: `broken_signature` alone could silently mask an early
# regression that happened to emit `@_lifetime`; pinning these seven
# sibling-ready lines forces the run to have walked the hardened
# 1d20825 transitive paths before the Xcode bug trips.
required_log_signatures = [
    "CombineSchedulers.xcframework ready",
    "ConcurrencyExtras.xcframework ready",
    "CustomDump.xcframework ready",
    "Dependencies.xcframework ready",
    "IdentifiedCollections.xcframework ready",
    "IssueReporting.xcframework ready",
    "XCTestDynamicOverlay.xcframework ready",
]
broken_reason = "Same Xcode 26.3 + swift-collections 1.5.x interaction as swift-async-algorithms. TCA's transitive closure terminates in swift-collections, whose InternalCollectionsUtilities target's `@_lifetime`-annotated `~Escapable` helpers are rejected by xcodebuild's library-evolution EmitSwiftModule phase. CRITICAL CONTEXT FOR REGRESSION VALUE: the transitive-products orchestrator (28863d1) schedules swift-collections early in TCA's topological closure, so OrderedCollections trips the Xcode bug before the later transitive packages (swift-perception, swift-sharing, swift-navigation) get a chance. Seven sibling xcframeworks DO build successfully en route (CombineSchedulers, ConcurrencyExtras, CustomDump, Dependencies, IdentifiedCollections, IssueReporting, XCTestDynamicOverlay) — those seven prove commit 1d20825's TCA-class hardening works for the early portion of the graph. When the Xcode bug is fixed and OrderedCollections starts building cleanly, the remaining six (OrderedCollections, Perception, PerceptionCore, Sharing, SwiftNavigation, UIKitNavigation, plus ComposableArchitecture itself) will succeed too — flip known_broken=false then and expand both expected_products and required_log_signatures to cover all 13. The `required_log_signatures` field below is the load-bearing regression guard — Codex review caught that without it, an early failure that still happened to emit the broken_signature would silently mask as known_broken."
notes = "Direct regression test for commit 1d20825 (Harden the transitive-siblings path against TCA-class graphs). Currently known_broken due to a downstream swift-collections / Xcode 26.3 interaction, but the 13 dependency xcframeworks that build successfully en route to the failure are exactly what exercises the hardening — enforced by required_log_signatures. When that bug is fixed upstream, flip known_broken=false and expand expected_products to also include the 13 siblings (so the matrix asserts every product, not just the umbrella)."

# 16 — Two products backing the same target. Alamofire ships both
# `.library(name: "Alamofire", targets: ["Alamofire"])` (implicit static)
# AND `.library(name: "AlamofireDynamic", type: .dynamic, targets:
# ["Alamofire"])` — same target, two product faces. Filtering to a single
# product (`--product Alamofire`) forces the planner to synth a dynamic
# sibling even though the SAME target is already exposed as a dynamic
# product via `AlamofireDynamic`. Also stress-tests the upcoming-feature
# swift setting (`ExistentialAny`) and `swiftLanguageModes: [.v5]`.
[[package]]
name = "alamofire"
url = "https://github.com/Alamofire/Alamofire"
version = "5.10.2"
min_versions = { ios = "13.0" }
args = ["--product", "Alamofire"]
expected_products = ["Alamofire"]
exercises = [
    "pure-swift-single-product",
    "two-products-same-target",  # `Alamofire` + `AlamofireDynamic` share target
    "synth_dynamic_library",  # static-default product needs synth dynamic sibling
    "upcoming-feature-swift-setting",  # .enableUpcomingFeature("ExistentialAny")
    "swift-language-modes",  # swiftLanguageModes: [.v5]
    "inject_resource_bundles",  # PrivacyInfo.xcprivacy
    "linker-settings-platform-gated",  # .when(platforms: [...]) on linkedFramework
    "popular-consumer-library",
]
notes = "Real-world popular HTTP library. The dual-product / single-target manifest shape is unique in the matrix — Plan must not get confused by the sibling `AlamofireDynamic` product when the user requests `Alamofire`. ExistentialAny upcoming-feature gate is a hard error at archive time if not propagated correctly."

# 17 — Older swift-tools-version (5.1) single-product pure-Swift consumer
# library. Kingfisher is the canonical popular-package smoke entry — wide
# real-world usage, simple manifest, exercises the tools-version-bump
# path on the lowest end of the supported swift-tools-version range.
[[package]]
name = "kingfisher"
